name: Exp123 execution sequence motifs
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/scientific_challenger_utils.py'
      - 'backend/app/ml/experiments/exp123_event_sequence_motifs.py'
      - 'tests/test_exp123_event_sequence_motifs.py'
      - '.github/workflows/exp123-compare.yml'
  workflow_dispatch:

jobs:
  exp123:
    name: exp123 (${{ matrix.training_end }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        training_end: [2019, 2021]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Integrity and leakage tests
        run: |
          python -m py_compile backend/app/ml/experiments/scientific_challenger_utils.py backend/app/ml/experiments/exp123_event_sequence_motifs.py
          PYTHONPATH=. pytest -q tests/test_exp123_event_sequence_motifs.py
      - name: Fresh production vs Exp123
        env:
          PYTHONPATH: '${{ github.workspace }}'
          TRAINING_END: '${{ matrix.training_end }}'
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from backend.app.ml import production_exp61_baseline as exp61_production
          from backend.app.ml.experiments import nextgen_common
          from backend.app.ml.experiments import exp123_event_sequence_motifs as exp123

          pattern = re.compile(r'^Only (\d+) projects have AFT evidence; cannot form the requested (\d+)-project calibration cohort\.$')
          original_helper = exp123._rolling_oof_with_adaptive_aft_gate
          original_selector = exp61_production._select_aft_calibration_projects
          original_nextgen_selector = nextgen_common._select_aft_calibration_projects

          def helper(*args, **kwargs):
              def selector(frame, limit=688):
                  try:
                      return original_selector(frame, limit=limit)
                  except RuntimeError as exc:
                      match = pattern.match(str(exc))
                      if not match:
                          raise
                      available = int(match.group(1))
                      if available < 20:
                          raise
                      return original_selector(frame, limit=available)
              exp61_production._select_aft_calibration_projects = selector
              nextgen_common._select_aft_calibration_projects = selector
              try:
                  return original_helper(*args, **kwargs)
              finally:
                  exp61_production._select_aft_calibration_projects = original_selector
                  nextgen_common._select_aft_calibration_projects = original_nextgen_selector

          exp123._rolling_oof_with_adaptive_aft_gate = helper
          try:
              training_end = int(os.environ['TRAINING_END'])
              exp123.run(Path('models/monthly_lifecycle/experiments/exp123/ci') / str(training_end), training_end=training_end)
          finally:
              exp123._rolling_oof_with_adaptive_aft_gate = original_helper
              exp61_production._select_aft_calibration_projects = original_selector
              nextgen_common._select_aft_calibration_projects = original_nextgen_selector
          PY
      - name: Scientific verdict
        if: always()
        run: |
          test -f reports/exp123_final_report.json
          python - <<'PY'
          import json
          p=json.load(open('reports/exp123_final_report.json'))
          print('COST:', p['cost_verdict'])
          print('DELAY:', p['delay_verdict'])
          for w in p['windows']:
              print(w['window'], 'cost', w['cost']['base_mae'], '->', w['cost']['experiment_mae'], w['cost']['improvement_pct'])
              print(w['window'], 'delay', w['delay']['base_mae'], '->', w['delay']['experiment_mae'], w['delay']['improvement_pct'])
          print('EXECUTION VALID — scientific regression is not a CI failure')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp123-scientific-evidence-${{ matrix.training_end }}
          path: |
            reports/exp123_final_report.*
            models/monthly_lifecycle/experiments/exp123/ci/${{ matrix.training_end }}/
          if-no-files-found: error
