name: Exp127 cost revision shock persistence
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/scientific_challenger_utils.py'
      - 'backend/app/ml/experiments/internal_signal_challengers.py'
      - 'backend/app/ml/experiments/exp127_cost_revision_shocks.py'
      - '.github/workflows/exp127-compare.yml'
  workflow_dispatch:
jobs:
  exp127:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Integrity and causal feature tests
        run: |
          python -m py_compile backend/app/ml/experiments/scientific_challenger_utils.py backend/app/ml/experiments/internal_signal_challengers.py backend/app/ml/experiments/exp127_cost_revision_shocks.py
          PYTHONPATH=. python -m backend.app.ml.experiments.exp127_cost_revision_shocks --self-test
      - name: Fresh production vs Exp127 on both future windows
        env: {PYTHONPATH: '${{ github.workspace }}'}
        run: python -m backend.app.ml.experiments.exp127_cost_revision_shocks --output-dir models/monthly_lifecycle/experiments/exp127/ci
      - name: Scientific verdict
        if: always()
        run: |
          test -f reports/exp127_final_report.json
          python - <<'PY'
          import json
          p=json.load(open('reports/exp127_final_report.json')); print('COST:',p['cost_verdict']); print('DELAY:',p['delay_verdict'])
          for w in p['windows']: print(w['window'],'cost',w['cost']['base_mae'],'->',w['cost']['experiment_mae'],w['cost']['improvement_pct'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp127-scientific-evidence
          path: |
            reports/exp127_final_report.json
            models/monthly_lifecycle/experiments/exp127/ci/
          if-no-files-found: error
