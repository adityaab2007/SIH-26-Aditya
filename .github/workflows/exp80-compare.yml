name: Experiment 80 deterministic linkage
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/exp80_deterministic_linkage.py'
      - 'tests/test_exp80_deterministic_linkage.py'
      - '.github/workflows/exp80-compare.yml'
  workflow_dispatch:
jobs:
  compare:
    name: compare (${{ matrix.window }})
    strategy:
      fail-fast: false
      matrix:
        window: ['2001-2019','2001-2021']
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Focused tests
        env: {PYTHONPATH: .}
        run: pytest -q tests/test_exp80_deterministic_linkage.py
      - name: Write scientific evidence status
        env:
          WINDOW: ${{ matrix.window }}
          BASE_SHA: 27bf096a906ff9565bc4cbc2ae16a7ac7d904c2b
        run: |
          mkdir -p audit_outputs/exp80
          python - <<'PY'
          import json,os,subprocess
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          w=os.environ['WINDOW']
          evidence={'experiment_id':'exp_80','experiment_sequence':80,'window':w,'head_sha':head,'base_sha':os.environ['BASE_SHA'],'production_cost_mae':None,'experiment_cost_mae':None,'cost_improvement_percent':None,'production_delay_mae':None,'experiment_delay_mae':None,'delay_improvement_percent':None,'comparison_projects':0,'comparison_snapshots':0,'verdict':'INVALID / INCOMPLETE','reason':'Linkage implementation is validated, but current main has no experiment-local retraining adapter that can safely rebuild the training dataset with expanded links without modifying production behavior. Scientific MAE evidence is therefore not fabricated.'}
          open(f'audit_outputs/exp80/{w}.json','w').write(json.dumps(evidence,indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-exp80-${{ matrix.window }}-results
          path: audit_outputs/exp80/${{ matrix.window }}.json
          if-no-files-found: error
