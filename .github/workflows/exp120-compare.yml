name: Exp120 real construction inflation
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ml/experiments/scientific_challenger_utils.py'
      - 'backend/app/ml/experiments/exp120_real_construction_inflation.py'
      - 'data/external/exp120_wpi/**'
      - 'scripts/prepare_exp120_wpi.py'
      - 'tests/test_exp120_real_construction_inflation.py'
      - '.github/workflows/exp120-compare.yml'
  workflow_dispatch:

jobs:
  exp120:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Integrity and leakage tests
        run: |
          python -m py_compile backend/app/ml/experiments/scientific_challenger_utils.py backend/app/ml/experiments/exp120_real_construction_inflation.py scripts/prepare_exp120_wpi.py
          PYTHONPATH=. pytest -q tests/test_exp120_real_construction_inflation.py
      - name: Fresh production vs Exp120 on both future windows
        env:
          PYTHONPATH: '${{ github.workspace }}'
        run: python -m backend.app.ml.experiments.exp120_real_construction_inflation --output-dir models/monthly_lifecycle/experiments/exp120/ci
      - name: Scientific verdict
        if: always()
        run: |
          test -f reports/exp120_final_report.json
          python - <<'PY'
          import json
          p=json.load(open('reports/exp120_final_report.json'))
          print('EXP120_VERDICT=', p['verdict'])
          print('EXTERNAL_SOURCE_STATUS=', p['source']['status'])
          for w in p['windows']:
              print(w['window'], 'base_cost_mae=', w['base_mae'], 'exp120_cost_mae=', w['experiment_mae'], 'improvement_pct=', w['improvement_pct'], 'status=', w['status'])
          print('EXECUTION VALID — scientific regression or insufficient verified data is not a CI failure')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp120-scientific-evidence
          path: |
            reports/exp120_final_report.*
            models/monthly_lifecycle/experiments/exp120/ci/
          if-no-files-found: error
