name: Experiment 82 PAIMANA bottleneck text features
on: {pull_request: {branches: [main]}, workflow_dispatch: {}}
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - window: '2001-2019'
            training_end: 2019
          - window: '2001-2021'
            training_end: 2021
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - env: {PYTHONPATH: .}
        run: pytest -q tests/test_exp82_paimana_bottlenecks.py
      - name: Fresh production vs Exp82 delay challenger
        env: {PYTHONPATH: .}
        run: |
          mkdir -p audit_outputs/exp82
          python -m backend.app.ml.experiments.exp82_scientific_runner \
            --training-end ${{ matrix.training_end }} \
            --output audit_outputs/exp82/${{ matrix.window }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-exp82-${{ matrix.window }}-results
          path: audit_outputs/exp82/${{ matrix.window }}.json
          if-no-files-found: error
