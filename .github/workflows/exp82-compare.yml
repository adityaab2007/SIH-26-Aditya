name: Experiment 82 PAIMANA bottleneck text features
on: {pull_request: {branches: [main]}, workflow_dispatch: {}}
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - window: '2001-2019'
            training_end: 2019
          - window: '2001-2021'
            training_end: 2021
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements-dev.txt
      - env: {PYTHONPATH: .}
        run: pytest -q tests/test_exp82_paimana_bottlenecks.py
      - name: Fresh production vs Exp82 delay challenger
        env: {PYTHONPATH: .}
        run: |
          mkdir -p audit_outputs/exp82
          python - <<'PY'
          import runpy
          import sys

          import backend.app.ml.production_exp35_baseline as exp35

          original_selector = exp35._select_aft_calibration_projects

          def oof_safe_selector(frame, limit=exp35.VERIFIED_AFT_CALIBRATION_PROJECTS):
              eligible = exp35.AFTResidualDelayModel._aft_eligible(frame)
              available = int(
                  frame.loc[eligible, "canonical_project_id"]
                  .astype("string")
                  .nunique()
              )
              return original_selector(frame, limit=min(int(limit), available))

          exp35._select_aft_calibration_projects = oof_safe_selector
          sys.argv = [
              "backend.app.ml.experiments.exp82_scientific_runner",
              "--training-end",
              "${{ matrix.training_end }}",
              "--output",
              "audit_outputs/exp82/${{ matrix.window }}.json",
          ]
          runpy.run_module(
              "backend.app.ml.experiments.exp82_scientific_runner",
              run_name="__main__",
          )
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-exp82-${{ matrix.window }}-results
          path: audit_outputs/exp82/${{ matrix.window }}.json
          if-no-files-found: error
