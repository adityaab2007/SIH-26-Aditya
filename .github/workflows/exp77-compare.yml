name: Experiment 77 production comparison
on:
  pull_request:
    paths:
      - 'backend/app/ml/experiments/cost_residual_challenger_common.py'
      - 'backend/app/ml/experiments/cost_residual_challenger_compat.py'
      - 'backend/app/ml/experiments/adapter_exp77.py'
      - 'scripts/run_exp77_compare.py'
      - 'tests/test_exp77_contract.py'
      - '.github/workflows/exp77-compare.yml'
  workflow_dispatch:
jobs:
  compare:
    name: compare (${{ matrix.window }})
    strategy:
      fail-fast: false
      matrix:
        window: ['2001-2019', '2001-2021']
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate sources
        run: python -m compileall -q backend scripts tests
      - name: Focused Experiment 77 tests
        env: {PYTHONPATH: .}
        run: pytest -q tests/test_exp77_contract.py
      - name: Compare production and Experiment 77 on ${{ matrix.window }}
        env:
          PYTHONPATH: .
          EXPERIMENT_WINDOW: ${{ matrix.window }}
        run: python scripts/run_exp77_compare.py
      - name: Upload Experiment 77 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-exp77-results-${{ matrix.window }}
          path: audit_outputs/exp77/
          if-no-files-found: error
